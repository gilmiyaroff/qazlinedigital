  function page7(){if(state.quizFinished)return resultPage();let i=Math.min(state.quizIndex||0,QUIZ.length-1);let q=QUIZ[i],answer=state.quizAnswers[i];let answered=Number.isInteger(answer);return `<div class="page">${head(7,'ФИНАЛЬНЫЙ ТЕСТ','Проверьте, что запомнили','Восемь коротких вопросов по всему уроку. После ответов увидите результат.')}<div class="quiz-top"><span class="quiz-step">ВОПРОС ${i+1} ИЗ ${QUIZ.length}</span><div class="quiz-bar"><span style="width:${(i+1)/QUIZ.length*100}%"></span></div></div><div class="quiz-question">${esc(q.q)}</div><div class="options">${q.a.map((a,idx)=>`<button type="button" class="option ${answer===idx?'chosen':''} ${answered?(idx===q.c?'correct':idx===answer?'wrong':''):''}" data-quiz-choice="${idx}" ${answered?'disabled':''}><span class="opt-letter">${'ABC'[idx]}</span>${esc(a)}</button>`).join('')}</div>${answered?`<div class="feedback ${answer===q.c?'good':'bad'}">${answer===q.c?'Верно! ':'Не совсем. '}${esc(q.why)}</div>`:''}<div class="lesson-footer"><button class="btn outline" data-go="6">← Назад</button><button class="btn primary" data-action="quizNext" ${answered?'':'disabled'}>${i===QUIZ.length-1?'Узнать результат':'Следующий вопрос'} <span class="arr">→</span></button></div></div>`}
function resultPage(){let score=state.quizAnswers.reduce((sum,a,i)=>sum+(a===QUIZ[i].c?1:0),0);let t=score>=7?'Отличная работа!':score>=5?'Хорошее начало!':'Вы уже сделали первый шаг!';return `<div class="page"><div class="result"><div class="result-medal"><img src="assets/sunny.webp" width="78" height="78" alt=""></div><div class="hidden-medal">${score>=7?'🏆':score>=5?'🌟':'🌱'}</div><div class="pill">УРОК ЗАВЕРШЁН</div><h2>${t}</h2><div class="score">${score} / ${QUIZ.length}</div><p>Вы потренировались спрашивать о погоде, выбирать нужные слова, составлять фразы и отвечать на вопросы. ${score<QUIZ.length?'Ошибки — часть обучения. Можно пройти мини-тест ещё раз.':'Все ответы верные — супер!'}</p><div class="result-actions"><button type="button" class="btn primary" data-action="retryQuiz">Повторить тест ↺</button><button type="button" class="btn outline" data-go="0">Вернуться к уроку</button></div><div class="cta-card"><div class="cta-kicker">ХОТИТЕ ЗАГОВОРИТЬ НА КАЗАХСКОМ?</div><h3>Продолжим вместе с Qazline!</h3><p>На уроке вы научились говорить о погоде. На занятиях с преподавателем постепенно перейдёте к настоящим разговорам — о себе, работе, семье и планах.</p><a class="wa-btn" href="https://wa.me/77082397128?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%21%20%D0%AF%20%D0%BF%D1%80%D0%BE%D1%88%D1%91%D0%BB%20%D0%B8%D0%BD%D1%82%D0%B5%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B9%20%D1%83%D1%80%D0%BE%D0%BA%20%C2%AB%D0%9F%D0%BE%D0%B3%D0%BE%D0%B4%D0%B0%20%D0%BD%D0%B0%20%D0%BA%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D0%BA%D0%BE%D0%BC%C2%BB%20%D0%B8%20%D1%85%D0%BE%D1%87%D1%83%20%D1%83%D0%B7%D0%BD%D0%B0%D1%82%D1%8C%20%D0%BE%20%D0%BA%D1%83%D1%80%D1%81%D0%B0%D1%85%20Qazline." target="_blank" rel="noopener noreferrer" aria-label="Написать менеджеру Qazline в WhatsApp"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><path d="M20.52 3.48A11.86 11.86 0 0 0 12.07 0C5.52 0 .18 5.32.18 11.89c0 2.09.55 4.14 1.6 5.94L0 24l6.34-1.66a11.85 11.85 0 0 0 5.73 1.46h.01c6.55 0 11.89-5.33 11.92-11.89a11.8 11.8 0 0 0-3.48-8.43ZM12.08 21.8a9.93 9.93 0 0 1-5.06-1.39l-.36-.22-3.76.99 1-3.67-.23-.38a9.91 9.91 0 0 1-1.52-5.24c0-5.48 4.46-9.94 9.96-9.94a9.91 9.91 0 0 1 7.03 2.91 9.86 9.86 0 0 1 2.91 7.04c-.02 5.47-4.49 9.9-9.97 9.9Zm5.45-7.44c-.3-.15-1.77-.87-2.04-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.23-.65.08a8.13 8.13 0 0 1-2.4-1.48 8.97 8.97 0 0 1-1.66-2.06c-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.08-.8.38-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.21 5.09 4.5.71.3 1.27.48 1.71.61.72.23 1.38.2 1.9.12.58-.09 1.77-.73 2.02-1.43.25-.7.25-1.3.18-1.43-.08-.12-.28-.2-.58-.35Z"/></svg> Написать менеджеру в WhatsApp <span aria-hidden="true">↗</span></a><small>Ссылка ведёт в официальный WhatsApp Qazline.</small></div></div></div>`}
  function render(){drawNav();let pages=[page0,page1,page2,page3,page4,page5,page6,page7];el('app').innerHTML=pages[state.step]();persist()}
  function go(n){state.step=Math.min(7,Math.max(0,Number(n)||0));selectedToken=null;persist();render();window.scrollTo(0,0)}
  function putDrag(ch,index,value){const d=DRAGS[ch];if(!d||index<0||index>=d.questions.length)return;let map=state.filled[ch]||{};if(d.unique){for(let k of Object.keys(map)){if(map[k]===value)delete map[k]}}map[index]=value;state.filled[ch]=map;state.checks[ch]=false;selectedToken=null;render()}
  function putSort(index,type){if(!CATEGORIZE[index]||!['desc','action'].includes(type))return;state.sort[index]=type;state.checks[4]=false;selectedToken=null;render()}
  function setToken(ch,val){selectedToken=selectedToken&&selectedToken.ch===ch&&selectedToken.value===val?null:{ch,value:val};render()}
  function assignDrop(target,ch,value){if(!target)return false;if(target.closest('[data-slot]')){let el=target.closest('[data-slot]'),step=Number(el.dataset.ch);if(step!==ch)return false;putDrag(step,Number(el.dataset.slot),value);return true}if(target.closest('[data-bucket]')){let el=target.closest('[data-bucket]');if(ch!==4)return false;putSort(Number(value),el.dataset.bucket);return true}return false}
  function onAction(name,node){switch(name){
    case 'checkIntro':{state.checks[1]=true;if(state.introChoice===0)complete(1);render();break}
    case 'checkDrag':{let ch=Number(node.dataset.ch),d=DRAGS[ch],f=state.filled[ch]||{};state.checks[ch]=true;if(d.questions.every((r,i)=>r[2]===f[i]))complete(ch);render();break}
    case 'clearDrag':{let ch=Number(node.dataset.ch);state.filled[ch]={};state.checks[ch]=false;render();break}
    case 'checkSort':{state.checks[4]=true;if(CATEGORIZE.every((r,i)=>state.sort[i]===r[1]))complete(4);render();break}
    case 'clearSort':state.sort={};state.checks[4]=false;render();break;
    case 'quizNext':{if(!Number.isInteger(state.quizAnswers[state.quizIndex]))return;if(state.quizIndex>=QUIZ.length-1){state.quizFinished=true;complete(7)}else state.quizIndex++;render();break}
    case 'retryQuiz':state.quizIndex=0;state.quizAnswers=[];state.quizFinished=false;state.done=state.done.filter(i=>i!==7);render();break;
  }}
  el('steps').addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
  el('mobileStepSelect').addEventListener('change',e=>go(e.target.value));
  el('restartTop').addEventListener('click',()=>{if(confirm('Начать урок заново? Текущие ответы будут очищены.')){state=initial();go(0)}});
  el('app').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.go!==undefined){go(b.dataset.go);return}
    if(b.dataset.action){onAction(b.dataset.action,b);return}
    if(b.dataset.choice!==undefined){state.introChoice=Number(b.dataset.choice);state.checks[1]=false;render();return}
    if(b.dataset.quizChoice!==undefined){let i=state.quizIndex;if(Number.isInteger(state.quizAnswers[i]))return;state.quizAnswers[i]=Number(b.dataset.quizChoice);render();return}
    if(b.dataset.removeSort!==undefined){delete state.sort[b.dataset.removeSort];state.checks[4]=false;render();return}
    if(b.dataset.slot!==undefined){const ch=Number(b.dataset.ch);if(selectedToken&&selectedToken.ch===ch){putDrag(ch,Number(b.dataset.slot),selectedToken.value)}else if(state.filled[ch]&&state.filled[ch][b.dataset.slot]){delete state.filled[ch][b.dataset.slot];state.checks[ch]=false;render()}return}
  });
  el('app').addEventListener('keydown',e=>{const chip=e.target.closest('[data-token]');if(chip&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setToken(Number(chip.dataset.ch),chip.dataset.token)}const bucket=e.target.closest('[data-bucket]');if(bucket&&(e.key==='Enter'||e.key===' ')&&selectedToken&&selectedToken.ch===4){e.preventDefault();putSort(Number(selectedToken.value),bucket.dataset.bucket)}});
  let hovered=null;
  document.addEventListener('pointerdown',e=>{
    const chip=e.target.closest('#app [data-token]');if(!chip||chip.disabled||chip.classList.contains('used'))return;
    activePointer={id:e.pointerId,ch:Number(chip.dataset.ch),value:chip.dataset.token,x:e.clientX,y:e.clientY,moved:false,ghost:null};
    try{chip.setPointerCapture(e.pointerId)}catch(err){}
  });
  document.addEventListener('pointermove',e=>{
    let p=activePointer;if(!p||e.pointerId!==p.id)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(!p.moved&&Math.hypot(dx,dy)>9){p.moved=true;const g=document.createElement('div');g.className='drag-ghost';g.textContent=p.ch===4?CATEGORIZE[Number(p.value)][0]:p.value;document.body.appendChild(g);p.ghost=g}
    if(!p.moved)return;e.preventDefault();p.ghost.style.left=e.clientX+'px';p.ghost.style.top=e.clientY+'px';if(hovered)hovered.classList.remove('hov');hovered=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot],[data-bucket]')||null;if(hovered)hovered.classList.add('hov');
  },{passive:false});
  document.addEventListener('pointerup',e=>{
    let p=activePointer;if(!p||e.pointerId!==p.id)return;
    if(p.ghost)p.ghost.remove();if(hovered){hovered.classList.remove('hov');hovered=null}
    const dest=p.moved?document.elementFromPoint(e.clientX,e.clientY):null;
    activePointer=null;
    if(p.moved){if(!assignDrop(dest,p.ch,p.value))setToken(p.ch,p.value)}else setToken(p.ch,p.value);
  });
  document.addEventListener('pointercancel',()=>{if(activePointer?.ghost)activePointer.ghost.remove();activePointer=null;if(hovered)hovered.classList.remove('hov');hovered=null});
  // Поддержка выбора группы после касания карточки.
  el('app').addEventListener('click',e=>{let bucket=e.target.closest('[data-bucket]');if(bucket&&selectedToken?.ch===4){putSort(Number(selectedToken.value),bucket.dataset.bucket)}});
  render();
})();
</script>
